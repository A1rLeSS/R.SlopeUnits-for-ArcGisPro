name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q BasinSlopeTools/Tools tests scripts

      - name: Check local Markdown links
        shell: bash
        run: python scripts/check_markdown_links.py

  windows-version-check:
    name: Windows release metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version markers
        shell: pwsh
        run: ./scripts/check-version.ps1
